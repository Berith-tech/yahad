@if (token()) {
  <app-confirm-password-form
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    [successMessage]="successMessage()"
    (submitted)="onResetPassword($event)"
  ></app-confirm-password-form>
} @else {
  <app-reset-password-form
    [loading]="loading()"
    [errorMessage]="errorMessage()"
    [successMessage]="successMessage()"
    (submitted)="onForgotPassword($event)"
  ></app-reset-password-form>
}
