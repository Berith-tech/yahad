<form (ngSubmit)="onSubmit()">
  <h2>Recuperar senha</h2>

  <label for="email">E-mail</label>
  <input
    id="email"
    type="email"
    name="email"
    [(ngModel)]="email"
    [disabled]="loading"
    required
  />

  <button type="submit" [disabled]="loading">
    {{ loading ? 'Enviando...' : 'Enviar' }}
  </button>

  @if (errorMessage) {
    <p class="error">{{ errorMessage }}</p>
  }

  @if (successMessage) {
    <p class="success">{{ successMessage }}</p>
  }
</form>
